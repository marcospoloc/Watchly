version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-dependencies:
        patterns: ["*"]
    # The project stays on AGP 8.13 (see docs/adr/0004). Versions that need
    # AGP 9, or that Hilt 2.58 cannot process, are ignored so the weekly
    # grouped pull request only contains updates that pass CI.
    ignore:
      # Migrating to AGP 9 is a deliberate, separate change.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      # AGP 8.x does not run on Gradle 9.6+.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      # Hilt 2.59+ requires AGP 9.
      - dependency-name: "com.google.dagger*"
        versions: [">= 2.59"]
      # These AndroidX releases declare minAndroidGradlePluginVersion 9.1.
      - dependency-name: "androidx.core:core*"
        versions: [">= 1.19"]
      - dependency-name: "androidx.lifecycle:*"
        versions: [">= 2.11"]
      - dependency-name: "androidx.navigation:*"
        versions: [">= 2.10"]
      - dependency-name: "androidx.hilt:*"
        versions: [">= 1.4"]
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">= 2026.08.00"]
      # Built with Kotlin 2.4, whose metadata Hilt 2.58 cannot read.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization*"
        versions: [">= 1.12"]
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">= 2.4"]
      - dependency-name: "com.google.devtools.ksp"
        versions: [">= 2.4"]
      # Major migrations with API changes are done on purpose, not automatically.
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.coil-kt:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
